services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: xscan
      POSTGRES_PASSWORD: xscan
      POSTGRES_DB: xscan
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U xscan -d xscan"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    env_file: ./backend/.env
    environment:
      DATABASE_URL: postgres://xscan:xscan@db:5432/xscan
      CORS_ORIGIN: http://localhost:3000
    ports:
      - "4000:4000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:4000/api/v1/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
    profiles: ["full"]

volumes:
  pgdata:
